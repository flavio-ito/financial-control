name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testes e build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do backend
        run: python -m pip install -r backend/requirements.lock

      - name: Instalar dependências do frontend
        run: npm ci --prefix frontend

      - name: Testar backend
        run: python -m pytest backend/tests -q

      - name: Testar frontend
        run: npm test --prefix frontend -- --run

      - name: Validar TypeScript
        run: npm run typecheck --prefix frontend

      - name: Compilar frontend
        run: npm run build --prefix frontend
